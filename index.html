<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071A33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vehicle Check">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Vehicle Check | GNR1</title>
<style>
:root{--navy:#071A33;--navy2:#0D2B52;--red:#D71920;--red2:#B51218;--bg:#F4F7FB;--text:#172033;--muted:#667085;--line:#E7ECF3;--white:#fff;--green:#16834B;--shadow:0 12px 35px rgba(7,26,51,.10)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Thai","Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
.header{background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;padding:18px 16px 48px;position:relative;overflow:hidden}
.header:after{content:"";position:absolute;width:220px;height:220px;border:35px solid rgba(255,255,255,.045);border-radius:50%;right:-90px;top:-100px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;z-index:1}
.title{display:flex;align-items:center;gap:10px}
.logo{width:43px;height:43px;border-radius:13px;background:#fff;display:grid;place-items:center;font-size:23px;box-shadow:0 7px 20px rgba(0,0,0,.15)}
h1{font-size:22px;margin:0;font-weight:900}
.subtitle{font-size:11px;margin:2px 0 0;opacity:.78}
.install-btn{display:none;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800}
.container{max-width:560px;margin:-24px auto 30px;padding:0 12px;position:relative}
.card{background:#fff;border-radius:18px;box-shadow:var(--shadow)}
.search-card{padding:16px}
.search-label{font-size:13px;font-weight:900;margin-bottom:8px}
.search-wrap{display:flex;gap:8px}
input{flex:1;min-width:0;border:1.8px solid #D8E0EA;background:#FAFCFF;border-radius:13px;padding:13px 13px;font-size:17px;color:var(--text);outline:none}
input:focus{border-color:var(--navy2);background:#fff;box-shadow:0 0 0 4px rgba(13,43,82,.07)}
.search-btn{width:88px;border:0;border-radius:13px;background:var(--red);color:#fff;font-size:14px;font-weight:900;cursor:pointer}
.search-btn:active{transform:scale(.98);background:var(--red2)}
.search-btn:disabled{opacity:.65}
.hint{font-size:10.5px;color:var(--muted);margin-top:7px}
.quick{display:flex;gap:7px;margin-top:9px;overflow:auto;padding-bottom:2px}
.quick button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:10.5px;color:var(--navy2)}
.result{display:none;margin-top:12px;overflow:hidden}
.result-head{background:linear-gradient(145deg,#F8FAFD,#EEF3F9);padding:17px}
.plate-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.plate{font-size:27px;font-weight:900;color:var(--navy);letter-spacing:.3px}
.car-icon{font-size:29px}
.model{font-size:12px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;margin-top:9px;padding:5px 9px;border-radius:999px;background:#EAF0F7;color:var(--navy2);font-size:10.5px;font-weight:900}
.body{padding:3px 16px 17px}
.section{margin-top:16px}
.section-head{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:900;color:var(--navy);padding-bottom:7px;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #F0F3F7;font-size:12px}
.row:last-child{border-bottom:0}
.label{color:var(--muted);flex:0 0 38%}
.value{text-align:right;font-weight:800;word-break:break-word}
.insurance{background:#F8FAFD;border:1px solid #E8EDF4;border-radius:14px;padding:10px;margin-top:9px}
.call{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:12px;margin-top:10px;border-radius:12px;background:var(--green);color:#fff;text-decoration:none;font-size:13px;font-weight:900}
.gnr{margin-top:12px;padding:16px;text-align:center;background:var(--navy);color:#fff}
.gnr-title{font-size:14px;font-weight:900}.gnr-sub{font-size:10.5px;opacity:.7;margin:3px 0 11px}
.tel-grid{display:flex;gap:7px;justify-content:center}
.tel{flex:1;max-width:110px;background:#fff;color:var(--navy);text-decoration:none;border-radius:10px;padding:9px 5px;font-weight:900;font-size:13px}
.tel small{display:block;font-size:8.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.msg{display:none;margin-top:12px;padding:23px;text-align:center}
.msg-icon{font-size:36px}.msg h3{margin:7px 0 4px;font-size:16px}.msg p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.retry{margin-top:11px;border:0;border-radius:10px;background:var(--navy);color:#fff;padding:9px 14px;font-size:11px;font-weight:800}
.loading{display:none;text-align:center;color:var(--muted);font-size:12px;padding:11px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #DDE4EC;border-top-color:var(--navy);border-radius:50%;vertical-align:-3px;margin-right:6px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;color:#98A2B3;font-size:9.5px;margin:14px 0}
.install-help{display:none;margin-top:10px;background:#F8FAFD;border:1px solid var(--line);border-radius:13px;padding:11px;font-size:10.5px;color:var(--muted);line-height:1.5}
@media(min-width:600px){.header{padding-left:calc((100% - 560px)/2 + 12px);padding-right:calc((100% - 560px)/2 + 12px)}}
@media(max-width:380px){.plate{font-size:24px}.search-btn{width:80px}.row{font-size:11.5px}}
</style>
</head>
<body>
<header class="header">
  <div class="topbar">
    <div class="title">
      <div class="logo">🚗</div>
      <div><h1>Vehicle Check</h1><div class="subtitle">ระบบตรวจสอบข้อมูลรถ • GNR1</div></div>
    </div>
    <button id="installBtn" class="install-btn">＋ ติดตั้ง</button>
  </div>
</header>

<main class="container">
  <section class="card search-card">
    <div class="search-label">🔎 ค้นหาข้อมูลรถด้วยทะเบียน</div>
    <div class="search-wrap">
      <input id="q" type="text" inputmode="text" autocomplete="off" autocapitalize="characters"
             placeholder="เช่น 3ฒบ 5081" enterkeyhint="search">
      <button id="searchBtn" class="search-btn">ค้นหา</button>
    </div>
    <div class="hint">พิมพ์ทะเบียนได้ทั้งแบบมีเว้นวรรค หรือไม่มีเว้นวรรค</div>
    <div class="quick">
      <button type="button" data-plate="3ฒฟ 7076">ตัวอย่าง 3ฒฟ 7076</button>
    </div>
    <div id="loading" class="loading"><span class="spinner"></span>กำลังค้นหาข้อมูล...</div>
  </section>

  <section id="result" class="card result"></section>
  <section id="msg" class="card msg"></section>

  <section class="card gnr">
    <div class="gnr-title">แผนกบริการกลาง GNR1</div>
    <div class="gnr-sub">สอบถามข้อมูลรถ / ติดต่อเจ้าหน้าที่</div>
    <div class="tel-grid">
      <a class="tel" href="tel:3282"><small>ติดต่อ</small>3282</a>
      <a class="tel" href="tel:3283"><small>ติดต่อ</small>3283</a>
      <a class="tel" href="tel:3286"><small>ติดต่อ</small>3286</a>
    </div>
  </section>

  <div id="installHelp" class="install-help"></div>
  <div class="footer">Vehicle Check V2 • Mobile / PWA • GNR1</div>
</main>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxvGqGlvJ7vkq7r-trUFCGVTJx5BxrhuaSoEX-odnUvrtO6W7JkUFq3x75K0fW8nA6w/exec";
const q=document.getElementById("q"), result=document.getElementById("result"), msg=document.getElementById("msg");
const loading=document.getElementById("loading"), searchBtn=document.getElementById("searchBtn");

function esc(v){return String(v??"-").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function row(a,b){return `<div class="row"><span class="label">${esc(a)}</span><span class="value">${esc(b)}</span></div>`}
function showMsg(icon,title,text,button=false){
  msg.innerHTML=`<div class="msg-icon">${icon}</div><h3>${title}</h3><p>${text}</p>${button?'<button class="retry" onclick="search()">ลองค้นหาอีกครั้ง</button>':''}`;
  msg.style.display="block";
}
async function search(){
  const plate=q.value.trim();
  result.style.display="none"; msg.style.display="none";
  if(!plate){showMsg("🔎","กรุณากรอกทะเบียนรถ","พิมพ์ทะเบียนรถที่ต้องการตรวจสอบ");q.focus();return}
  loading.style.display="block";searchBtn.disabled=true;
  try{
    const res=await fetch(API_URL+"?plate="+encodeURIComponent(plate),{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const v=await res.json();
    if(v.error){
      showMsg("⚙️","ระบบฐานข้อมูลมีปัญหา",esc(v.error)+"<br>กรุณาติดต่อ GNR1",true);
      return;
    }
    if(!v.found){
      showMsg("⚠️","ไม่พบข้อมูลรถ",`ไม่พบทะเบียน <b>${esc(plate)}</b> ในฐานข้อมูล<br>หากทะเบียนถูกต้อง กรุณาติดต่อ GNR1`);
      return;
    }
    const tel=String(v["เบอร์โทรประกัน"]||"").replace(/[^\d+]/g,"");
    result.innerHTML=`
      <div class="result-head">
        <div class="plate-row"><div><div class="plate">${esc(v["ทะเบียนรถ"])}</div><div class="model">${esc(v["รุ่นรถ"])}</div></div><div class="car-icon">🚘</div></div>
        ${v["Vendor"]?`<span class="badge">Vendor: ${esc(v["Vendor"])}</span>`:""}
      </div>
      <div class="body">
        <div class="section"><div class="section-head">🏢 หน่วยงานและสาขา</div>
          ${row("สังกัด",v["สังกัด"])}${row("ฝ่าย",v["ฝ่าย(ตัวย่อ)"])}${row("แผนก",v["แผนก"])}
          ${row("ID Branch",v["ID Branch"])}${row("Branch",v["Branch Name"])}
        </div>
        <div class="section"><div class="section-head">🛡️ ข้อมูลประกันภัย</div>
          <div class="insurance">${row("บริษัทประกันภัย",v["บริษัทประกันภัย"])}${row("เบอร์โทรประกัน",v["เบอร์โทรประกัน"])}
          ${tel?`<a class="call" href="tel:${tel}">📞 โทรบริษัทประกันภัย</a>`:""}</div>
        </div>
      </div>`;
    result.style.display="block";
    result.scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){
    showMsg("📡","เชื่อมต่อระบบไม่ได้","กรุณาตรวจสอบอินเทอร์เน็ต หรือ Web App URL<br>หากยังมีปัญหา ติดต่อ GNR1",true);
  }finally{loading.style.display="none";searchBtn.disabled=false}
}
searchBtn.addEventListener("click",search);
q.addEventListener("keydown",e=>{if(e.key==="Enter")search()});
document.querySelectorAll(".quick button").forEach(b=>b.addEventListener("click",()=>{q.value=b.dataset.plate;search()}));

let deferredPrompt=null;
const installBtn=document.getElementById("installBtn"), installHelp=document.getElementById("installHelp");
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();deferredPrompt=e;installBtn.style.display="block";
});
installBtn.addEventListener("click",async()=>{
  if(!deferredPrompt){showInstallHelp();return}
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; installBtn.style.display="none";
});
function showInstallHelp(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  installHelp.style.display="block";
  installHelp.innerHTML=ios
    ?"📱 iPhone/iPad: กดปุ่ม <b>แชร์</b> ใน Safari → <b>เพิ่มไปยังหน้าจอโฮม</b> → กดเพิ่ม"
    :"📱 Android: เปิดด้วย Chrome แล้วกดเมนู <b>⋮</b> → <b>ติดตั้งแอป</b> หรือ <b>เพิ่มลงในหน้าจอหลัก</b>";
}
if(/iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone) setTimeout(showInstallHelp,1200);

if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
