<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<title>Vehicle Check GNR1</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2545;--navy2:#153b66;--blue:#1674ce;--red:#c8102e;--green:#13834a;--ink:#14243b;--mute:#63748b;--line:#e1e8f0;--bg:#f2f6fb;--card:#fff;--soft:#eaf2fb}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,#0b2545,#153b66);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 20px 28px;border-bottom:4px solid var(--red)}
.wrap{max-width:620px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:.1px}
header p{margin:3px 0 0;color:#c7d8ed;font-size:14px}
main{padding:18px 14px 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 5px 18px rgba(18,43,73,.045)}
.card h2{margin:0 0 10px;font-size:17px;color:var(--navy);font-weight:700}
.search label{display:block;font-weight:700;margin-bottom:8px;color:var(--navy)}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:600;padding:12px 14px;border:2px solid var(--line);border-radius:13px;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:3px solid #b8d8fa;border-color:var(--blue)}
button.go{font:inherit;font-weight:700;background:var(--red);color:#fff;border:0;border-radius:13px;padding:0 20px;cursor:pointer;min-height:54px;box-shadow:0 4px 10px rgba(200,16,46,.16)}
button.go:disabled{opacity:.6}
button:focus-visible,a:focus-visible{outline:3px solid #9db8e0;outline-offset:2px}
.hint{color:var(--mute);font-size:14px;margin:10px 0 0}
.eg{display:inline-flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.eg button{font:inherit;font-size:14px;background:#f3f7fc;border:1px solid #d6e1ef;border-radius:9px;padding:5px 11px;cursor:pointer;color:var(--navy)}
.status{display:none;margin-bottom:14px;padding:13px 15px;border-radius:13px;font-weight:600}
.status.show{display:block}
.status.err{background:#fff0f2;color:#9b1830;border:1px solid #f4c3cc}
.status.load{background:#eaf2fb;color:var(--navy);border:1px solid #c8d9ee}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #c5d3ee;border-top-color:var(--navy);border-radius:50%;vertical-align:-3px;margin-right:8px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.plate{display:inline-block;background:#fff;color:#111;border:2px solid #17263b;border-radius:10px;padding:4px 17px;font-size:30px;font-weight:700;letter-spacing:.5px;box-shadow:0 2px 7px rgba(0,0,0,.06)}
.platebox{text-align:center;padding:19px 16px;background:linear-gradient(180deg,#fff,#f8fbff)}
dl{margin:0}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
dt{color:var(--mute);flex:0 0 40%;font-size:14px}
dd{margin:0;text-align:right;font-weight:700;overflow-wrap:anywhere}
dd.empty{color:#9aa7ba;font-weight:400}
.actions{display:grid;gap:10px;margin-top:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;min-height:56px;border-radius:13px;color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:12px 15px;text-align:center;transition:filter .15s,transform .15s}
.btn.call{background:var(--blue)}

.btn.fix{background:#12804a}
.btn:active{filter:brightness(.92);transform:scale(.99)}
.na{min-height:50px;display:flex;align-items:center;justify-content:center;border:1px dashed #c4cedd;border-radius:13px;color:var(--mute);text-align:center;padding:10px;font-size:14px;background:#fafcff}
.sub{color:var(--mute);font-size:13px;text-align:center;margin:-2px 0 2px}

.contact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.contact b{background:var(--navy);color:#fff;border-radius:9px;padding:4px 12px;font-size:16px}
.footer-note{color:var(--mute);font-size:12px;text-align:center;margin:16px 0 0}
[hidden]{display:none!important}
@media(min-width:560px){main{padding-left:20px;padding-right:20px}.card{padding:20px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><div><h1>Vehicle Check</h1><p>ระบบตรวจสอบข้อมูลรถ • GNR1</p></div><div aria-hidden="true" style="font-size:30px">🚘</div></div>
</div></header>
<main><div class="wrap">
  <section class="card search">
    <label for="plate">ทะเบียนรถ</label>
    <div class="row">
      <input id="plate" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="เช่น 3ฒก 4281" enterkeyhint="search">
      <button class="go" id="go" type="button">ค้นหา</button>
    </div>
    <p class="hint">พิมพ์ทะเบียนรถได้ทั้งแบบมีหรือไม่มีเว้นวรรค ตัวอย่างเช่น</p>
    <div class="eg"><button type="button" data-eg="3ฒก 4281">3ฒก 4281</button><button type="button" data-eg="3ฒก4281">3ฒก4281</button></div>
  </section>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <div id="result" hidden>
    <section class="card platebox"><span class="plate" id="r-plate"></span></section>
    <section class="card"><h2>ข้อมูลรถ</h2><dl id="g-car"></dl></section>
    <section class="card"><h2>หน่วยงานและสาขา</h2><dl id="g-org"></dl></section>
    <section class="card"><h2>ข้อมูลประกันภัย</h2><dl id="g-ins"></dl></section>
    <section class="card"><div class="actions" id="actions"></div></section>
  </div>

  <section class="card">
    <h2>ติดต่อ GNR1</h2>
    <div class="contact"><span>เบอร์ภายใน</span><b>3282</b><b>3283</b><b>3286</b></div>
  </section>
  <p class="footer-note">Vehicle Check GNR1 • ข้อมูลอ้างอิงจากฐานข้อมูลส่วนกลาง</p>
</div></main>

<script>
(function () {
  'use strict';
  // ใส่ URL ของ Web App ที่ได้จากการ Deploy Google Apps Script (ลงท้ายด้วย /exec)
  var API_URL = 'https://script.google.com/macros/s/AKfycbxvGqGlvJ7vkq7r-trUFCGVTJx5BxrhuaSoEX-odnUvrtO6W7JkUFq3x75K0fW8nA6w/exec';
  var TIMEOUT_MS = 20000;
  var $ = function (id) { return document.getElementById(id); };
  var F = { plate: 'ทะเบียนรถ', model: 'รุ่นรถ', vendor: 'Vendor', affil: 'สังกัด', dept: 'ฝ่าย(ตัวย่อ)', section: 'แผนก',
    bid: 'ID Branch', bname: 'Branch Name', ins: 'บริษัทประกันภัย', tel: 'เบอร์โทรประกัน', link: 'Linkแจ้งซ่อม' };

  function show(kind, text) {
    var s = $('status'); s.className = 'status show ' + kind; s.textContent = '';
    if (kind === 'load') { var i = document.createElement('span'); i.className = 'spin'; s.appendChild(i); }
    s.appendChild(document.createTextNode(text));
  }
  function hideStatus() { $('status').className = 'status'; }

  // อนุญาตเฉพาะ http/https เท่านั้น (กัน javascript: ฯลฯ)
  function safeUrl(raw) {
    var t = String(raw || '').trim();
    if (!t) return null;
    try { var u = new URL(t); return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : null; } catch (e) { return null; }
  }
  // คืนเบอร์แรกที่ใช้โทรได้ (ตัดขีด/ช่องว่าง/วงเล็บ) หรือ null
  function dialNumber(raw) {
    var first = String(raw || '').split(/[,;\/\n]|\sหรือ\s/)[0];
    first = first.replace(/(ต่อ|ext\.?|#).*$/i, '');
    var d = first.replace(/[^\d+]/g, '');
    if (d.indexOf('+') > 0) d = d.replace(/\+/g, '');
    return d.replace(/\D/g, '').length >= 3 ? d : null;
  }

  function fill(dlId, items, data) {
    var dl = $(dlId); dl.textContent = '';
    items.forEach(function (it) {
      var div = document.createElement('div'); div.className = 'kv';
      var dt = document.createElement('dt'); dt.textContent = it[0];
      var dd = document.createElement('dd'); var v = String(data[it[1]] == null ? '' : data[it[1]]).trim();
      if (v) dd.textContent = v; else { dd.textContent = 'ไม่มีข้อมูล'; dd.className = 'empty'; }
      div.appendChild(dt); div.appendChild(dd); dl.appendChild(div);
    });
  }

  function render(d) {
    $('r-plate').textContent = d[F.plate];
    fill('g-car', [['ทะเบียนรถ', F.plate], ['รุ่นรถ', F.model], ['Vendor', F.vendor]], d);
    fill('g-org', [['สังกัด', F.affil], ['ฝ่าย', F.dept], ['แผนก', F.section], ['ID Branch', F.bid], ['Branch Name', F.bname]], d);
    fill('g-ins', [['บริษัทประกันภัย', F.ins], ['เบอร์โทรประกัน', F.tel]], d);
    var box = $('actions'); box.textContent = '';
    var num = dialNumber(d[F.tel]);
    if (num) {
      var a = document.createElement('a'); a.className = 'btn call'; a.href = 'tel:' + num;
      a.textContent = '📞 โทรบริษัทประกันภัย'; box.appendChild(a);
    } else {
      var n1 = document.createElement('div'); n1.className = 'na'; n1.textContent = '📞 ไม่มีข้อมูลเบอร์โทรประกัน'; box.appendChild(n1);
    }
    var url = safeUrl(d[F.link]);
    if (url) {
      var b = document.createElement('a'); b.className = 'btn fix'; b.href = url; b.target = '_blank'; b.rel = 'noopener noreferrer';
      b.textContent = '🛠️ แจ้งเช็คระยะและรายการอื่นๆ'; box.appendChild(b);
    } else {
      var n2 = document.createElement('div'); n2.className = 'na';
      n2.textContent = String(d[F.link] || '').trim() ? '🛠️ Link แจ้งซ่อมไม่ถูกต้อง' : '🛠️ ไม่มี Link แจ้งซ่อม';
      box.appendChild(n2);
    }
    $('result').hidden = false;
  }

  var busy = false;
  function search() {
    if (busy) return;
    var plate = $('plate').value.replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
    $('result').hidden = true;
    if (!plate) { show('err', 'กรุณากรอกทะเบียนรถ'); $('plate').focus(); return; }
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL)) { show('err', 'ยังไม่ได้ตั้งค่า API_URL ใน index.html (ดูคู่มือ README_TH.md)'); return; }
    if (navigator.onLine === false) { show('err', 'ไม่มีการเชื่อมต่ออินเทอร์เน็ต กรุณาตรวจสอบสัญญาณแล้วลองใหม่'); return; }
    busy = true; $('go').disabled = true; show('load', 'กำลังค้นหาข้อมูล...');
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, TIMEOUT_MS);
    fetch(API_URL + '?plate=' + encodeURIComponent(plate) + '&_=' + Date.now(), { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        if (d && d.found === true && d[F.plate]) { hideStatus(); render(d); }
        else if (d && d.found === false && !d.systemError) { show('err', (d.error || 'ไม่พบข้อมูลรถ') + ' กรุณาตรวจสอบทะเบียนแล้วลองใหม่'); }
        else { show('err', 'ระบบขัดข้อง ไม่สามารถตรวจสอบข้อมูลรถได้ กรุณาลองใหม่ หรือติดต่อ GNR1'); }
      })
      .catch(function () { show('err', 'เชื่อมต่อระบบไม่ได้ (อินเทอร์เน็ตขัดข้องหรือระบบไม่ตอบสนอง) ข้อมูลที่แสดงอาจไม่ถูกต้อง กรุณาลองใหม่'); })
      .then(function () { clearTimeout(timer); busy = false; $('go').disabled = false; });
  }

  $('go').addEventListener('click', search);
  $('plate').addEventListener('keydown', function (e) { if (e.key === 'Enter') search(); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-eg]'), function (b) {
    b.addEventListener('click', function () { $('plate').value = b.getAttribute('data-eg'); $('plate').focus(); });
  });
  var q = new URLSearchParams(location.search).get('plate');
  if (q) { $('plate').value = q; search(); }

  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
  window.__test = { safeUrl: safeUrl, dialNumber: dialNumber };
})();
</script>
</body>
</html>
